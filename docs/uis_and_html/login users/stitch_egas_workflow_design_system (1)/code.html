<body class="bg-background min-h-screen flex flex-col relative overflow-hidden">

</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center relative z-10 px-margin-mobile md:px-gutter py-stack-lg">
<!-- Logo Header -->
<div class="mb-stack-lg text-center flex flex-col items-center">
<img alt="EGAS Logo" class="h-24 md:h-32 mb-stack-md object-contain filter drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8JxAfnpXBA55MsGA358-tn60FaHZ3cYkwzu_8V_vi0buyygF-eT_swFxlbIvdEjXDSuQMCqU4csT-sOYzjkNMDDVfarjl9slOeqyyMLN1JdceIRsQh101QvTbsC5G1xBd1ufXFn7mdqGiz0tDMFuKTVw2c1_GeQrCXJLHthbVrnqkALxiGCZ2JeKKe4whPHDrSk97Vs1KZHn0l2NMhCblIZ0prBCSefsLXeOHCmhktLUFtDnpfMpr5NMXCCNAsePP3As"/>
<h1 class="font-display-lg text-display-lg text-on-primary text-center max-w-2xl drop-shadow-md">
                نظام إدارة مسارات عمل الموارد البشرية
            </h1>
</div>
<!-- Login Card -->
<div class="glass-card w-full max-w-md rounded-xl p-stack-lg flex flex-col gap-stack-md">
<div class="text-center mb-stack-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">مرحباً بك مجدداً</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">الرجاء إدخال بياناتك لتسجيل الدخول</p>
</div>
<!-- Error State Placeholder (Hidden by default) -->
<div class="hidden bg-error-container text-on-error-container font-body-md text-body-md p-3 rounded-lg border border-error mb-4 flex items-center gap-2" id="error-message">
<span class="material-symbols-outlined text-error" data-icon="error">error</span>
<span>اسم المستخدم أو كلمة المرور غير صحيحة</span>
</div>
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Username Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface" for="username">اسم المستخدم / الرقم الوظيفي</label>
<div class="relative">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
</div>
<input class="w-full pl-3 pr-10 py-2 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors outline-none" id="username" name="username" placeholder="أدخل اسم المستخدم" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface" for="password">كلمة المرور</label>
<div class="relative">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors outline-none" id="password" name="password" placeholder="أدخل كلمة المرور" type="password"/>
<button class="absolute inset-y-0 left-0 pl-3 flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="mr-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                            تذكرني
                        </label>
</div>
<div class="text-sm">
<a class="font-body-md text-body-md text-primary hover:text-primary-container font-medium transition-colors" href="#">
                            نسيت كلمة المرور؟
                        </a>
</div>
</div>
<!-- Action Button -->
<button class="mt-stack-sm w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm font-title-sm text-title-sm text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined" data-icon="login">login</span>
                    تسجيل الدخول
                </button>
</form>
</div>

<!-- Footer -->

<p class="font-body-md text-body-md text-on-primary/80">
            © ٢٠٢٤ الشركة المصرية القابضة للغازات الطبيعية (إيجاس). جميع الحقوق محفوظة.
        </p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
                toggleIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
                toggleIcon.setAttribute('data-icon', 'visibility');
            }
        }

        // Example to show error state for demonstration purposes
        // setTimeout(() => {
        //     document.getElementById('error-message').classList.remove('hidden');
        // }, 2000);
    </script>
